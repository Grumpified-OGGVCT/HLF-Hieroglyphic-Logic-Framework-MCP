[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hlf-mcp"
version = "0.5.0"
description = "SwarmGlass Governance Framework MCP Server — deterministic orchestration and governed execution for agentic systems (HLF language engine included)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27.1",
    "lark>=1.3.1",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.41.0",
    "anyio>=4.13.0",
    "pydantic>=2.11.0",
    "tiktoken>=0.13.0",
    "httpx>=0.28.0",
    "starlette>=0.46.0",
    "cryptography>=41.0.0",
    "pygls>=2.1.1",
    "lsprotocol>=2024.0.0",
]

[project.optional-dependencies]
# Hot cache tier — Valkey/Redis-compatible client (BSL-free Valkey official driver)
# Install:  uv sync --extra hot   |   pip install "hlf-mcp[hot]"
hot  = ["valkey>=6.0.0"]
# Full tier — hot + beartype for strict host-function type enforcement at runtime
# Install:  uv sync --extra full  |   pip install "hlf-mcp[full]"
full = ["valkey>=6.0.0", "beartype>=0.18.0", "z3-solver>=4.8.0"]
recursivemas = ["torch>=2.0.0", "transformers>=4.45.0", "peft>=0.12.0", "bitsandbytes>=0.43.0", "accelerate>=0.30.0", "datasets>=2.0.0", "trl>=0.10.0"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[project.scripts]
hlf-mcp  = "hlf_mcp.server:main"
hlfc     = "hlf_mcp.hlf.compiler:main"
hlffmt   = "hlf_mcp.hlf.formatter:main"
hlflint  = "hlf_mcp.hlf.linter:main"
hlfpm    = "hlf_mcp.hlf.hlfpm:main"
hlfrun   = "hlf_mcp.hlf.runtime:main"
hlfsh    = "hlf_mcp.hlf.hlfsh:main"
hlflsp   = "hlf_mcp.hlf.hlflsp:main"
hlftest  = "hlf_mcp.hlf.hlftest:main"
hlf-test-runner = "hlf_mcp.test_runner:main"
hlf-evidence = "hlf_mcp.evidence_query:main"
hlf-operator = "hlf_mcp.operator_cli:main"
sg-operator = "hlf_mcp.operator_cli:sg_main"
hlf-bench = "hlf_mcp.hlf.bench_tui:main"
hlf-recursivemas = "hlf_mcp.recursivemas.cli:main_inference"
hlf-recursivemas-train = "hlf_mcp.recursivemas.cli:main_train"
hlf-recursivemas-official = "hlf_mcp.recursivemas.cli:main_official"
hlf-recursivemas-governed = "hlf_mcp.recursivemas.cli:main_governed"

[tool.hatch.build.targets.wheel]
packages = ["hlf_mcp", "hlf_mcp.recursivemas", "governance"]

[tool.hatch.build.targets.wheel.shared-data]
"fixtures" = "hlf_mcp/fixtures"
"governance" = "hlf_mcp/governance"
"docs/HLF_PERSONA_OWNERSHIP_MATRIX.json" = "hlf_mcp/governance/HLF_PERSONA_OWNERSHIP_MATRIX.json"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
# asyncio_mode = "auto"  # not used — conftest.py has custom pytest_pyfunc_call hook
# Default automated collection lives under tests/. Root-level legacy probes and
# smoke scripts remain manual until fully migrated or retired.
testpaths = [
    "tests",
]

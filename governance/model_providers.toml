# Chain Overrides (Optional)
# ─────────────────────────────────────────────────────────────────────────────
# Per-lane chain preferences. If not set, uses model_catalog.py defaults.
# Models from any provider can be mixed in a chain.
# Use provider prefix for OpenRouter: "openrouter:deepseek/deepseek-r1"
# Ollama Cloud models use their native names: "nemotron-3-super"

# [chain_overrides.reasoning]
# models = ["nemotron-3-super:cloud", "cogito-2.1:671b-cloud", "openrouter:deepseek/deepseek-r1"]

[chain_overrides.coding]
# Tiers based on critical thinking, not mechanical sort:
#   T1 = high BenchLM + strong coding + good reasoning (generates correct, complex code)
#   T2 = strong coding but notable trade-off (e.g., great coding/weak reasoning, or great agent/tools)
#   T3 = capable, lower generation quality
#   T4 = budget fallback
models = [
    # Tier 1: Elite — high BenchLM AND coding AND reasoning
    "deepseek-v4-pro:cloud",       # BenchLM 88.0 (#1 available), 1M ctx — best overall
    "deepseek-v4-flash:cloud",     # Coding 80.6, Safety 95.8%, 4.2% hallucination — safest
    "deepseek-v3.2:cloud",         # Coding 80.8, Reasoning 81.7 — proven workhorse
    "glm-5.1:cloud",               # Coding 78.5, Reasoning 86.8 — reasoning backs coding
    "nemotron-3-super:cloud",      # Coding 81.2, Reasoning 88.9 — elite scores, low confidence
    # Tier 2: Strong — good at one dimension, weaker elsewhere
    "qwen3.5:397b-cloud",          # Coding 72.8, Reasoning 89.4, Tool Use 86.7, Agent Swarm 86.7 — best agentic
    "kimi-k2.6:cloud",             # BenchLM 85.0 (#5 overall), Vision Coding 76.7 — elite generalist, default model
    "kimi-k2.5:cloud",             # Coding 79.8 but Reasoning 47.0 — great templates, weak logic
    "devstral-2:123b-cloud",       # Coding 72.2 — repo-scale editing specialist
    "qwen3-coder:480b-cloud",      # Dedicated massive coding model
    "gemini-3-flash-preview:cloud",# Fast multimodal with coding capability
    "qwen3-next:80b-cloud",        # Strong multilingual reasoning+coding
    # Tier 3: Capable — solid for simpler tasks
    "qwen3-coder-next:cloud",      # Efficient repo-scale coder
    "glm-4.6:cloud",               # Coding 68.3, Reasoning 80.5 — solid multilingual
    "glm-4.7:cloud",               # Coding 72.0, Reasoning 83.3 — solid
    # Tier 4: Fallback — budget/execution only
    "minimax-m2.7:cloud",          # Coding 56.6 — budget option
    # OpenRouter fallbacks
    "openrouter:anthropic/claude-sonnet-4",
    "openrouter:qwen/qwen3-coder:free",
]

